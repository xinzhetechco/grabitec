<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: common_layout('stmp 邮件管理', ~{::section})}">
<body>
<div class="content-wrapper" style="margin-left: 0; padding: 20px;">
    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1 class="m-0">邮件服务配置 (SMTP)</h1>
                </div>
            </div>
        </div>
    </div>

    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-5">
                    <div class="card card-outline card-primary">
                        <div class="card-header">
                            <h3 class="card-title"><i class="fas fa-edit"></i> 修改/新增配置</h3>
                        </div>
                        <form th:action="@{/admin/mail-config/save}" method="post">
                            <div class="card-body">
                                <div class="form-group">
                                    <label>配置名称</label>
                                    <input type="text" class="form-control" name="configName" placeholder="例如：Google企业邮">
                                </div>
                                <div class="form-group">
                                    <label>SMTP 服务器</label>
                                    <input type="text" class="form-control" name="smtpHost" value="smtp.gmail.com">
                                </div>
                                <div class="row">
                                    <div class="col-6">
                                        <div class="form-group">
                                            <label>端口</label>
                                            <input type="number" class="form-control" name="smtpPort" value="465">
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-group">
                                            <label>安全连接</label>
                                            <select class="form-control" name="isSsl">
                                                <option value="true">SSL (推荐)</option>
                                                <option value="false">TLS/None</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>发件人账号 (Email)</label>
                                    <input type="email" class="form-control" name="senderEmail">
                                </div>
                                <div class="form-group">
                                    <label>应用专用密码 (App Password)</label>
                                    <input type="password" class="form-control" name="senderPassword" placeholder="16位授权码">
                                    <small class="text-muted">Google 企业邮需开启2FA后生成的应用密码</small>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button type="submit" class="btn btn-primary">保存并应用</button>
                                <button type="button" class="btn btn-default float-right">测试连接</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title"><i class="fas fa-list"></i> 已保存的服务</h3>
                        </div>
                        <div class="card-body p-0">
                            <table class="table table-hover text-nowrap">
                                <thead>
                                <tr>
                                    <th>名称</th>
                                    <th>账号</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="config : ${configs}">
                                    <td th:text="${config.configName}">Google Mail</td>
                                    <td th:text="${config.senderEmail}">admin@domain.com</td>
                                    <td>
                                        <span th:if="${config.isActive}" class="badge badge-success">启用中</span>
                                        <span th:unless="${config.isActive}" class="badge badge-secondary">备用</span>
                                    </td>
                                    <td>
                                        <a href="#" class="btn btn-xs btn-warning">编辑</a>
                                        <button class="btn btn-xs btn-danger">删除</button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="alert alert-info alert-dismissible">
                        <h5><i class="icon fas fa-info"></i> 配置说明</h5>
                        1. Google 企业邮务必使用端口 465 (SSL)。<br>
                        2. 密码非登录密码，请前往 Google 账号安全中心生成 16 位“应用专用密码”。
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
